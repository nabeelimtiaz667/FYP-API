<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload and API Call</title>
</head>
<body>
    <h2>Upload a File and Send to API</h2>
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>
    <p id="response"></p>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select a file first.");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch("http://127.0.0.1:8000/file-info/", {
                    method: "POST",
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                
                const result = await response.json();
                document.getElementById("response").innerText = "Response: " + JSON.stringify(result);
            } catch (error) {
                document.getElementById("response").innerText = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
